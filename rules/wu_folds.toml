graphs = "勿伐弗不"
decision = "same"
note = "veh, 'not'. 不 kept although it is the Mandarin graph: some argue 不 is the etymological character (古音 分勿切); Qian Nairong and common Shanghai usage write 勿 (2026-10-13)"

