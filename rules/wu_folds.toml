# Wu spelling folds: which characters count as the same word when scoring the "fold" view.
#
# The author's judgement of which swaps are reasonably the same word, made by listening to each one with its audio (first
# pass 2026-10-13). A judgement call, not a linguistic standard.
# Change any answer by editing its `decision` here. Git keeps the history.
#
# decision: "same"      -> counts as a match
#           "different" -> stays an error (different word, or Mandarin for Wu)
#           "unsure"    -> stays an error for now; revisit later
#
# RULE (2026-10-13): fold when the model wrote the SAME WORD with a different character, including when the
# Mandarin-looking character is itself the standard Wu spelling (我 not 吾, 人 not 拧, 啥 not 撒: Qian Nairong's
# 《上海话大词典》 prefers the etymological 本字, which is often the Mandarin character read the Wu way). It stays an
# error when the model swapped in a DIFFERENT, Mandarin word (这 for 搿, 掉 for 脱, 吧 for 伐). Same principle as
# the Cantonese evals; Shanghainese just has more legitimate Mandarin-looking spellings.
#
# PAIRS, NOT CHAINS. Every two characters *inside one entry* are equal; nothing chains across entries. So 末=么 and
# 么=嘛 do not make 末=嘛 (decided different), and 来=辣, 辣=了 do not make 来=了. Put several characters in one entry
# only when they are all spellings of one word with no other meaning (e.g. 勿伐弗不). A "different" entry wins over
# any "same" entry for that pair. Comparison runs after OpenCC t2s, so write Simplified characters.

# ---- same ----

